<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="发条远行">
<meta name="theme-color" content="#102e2a">
<title>发条远行</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081b1b;color:#c9e2d6;font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#canvas{display:block;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);outline:none;touch-action:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:32px;text-align:center;background:#102e2a;z-index:3}
h1{font-weight:500;letter-spacing:.2em;margin:0}p{max-width:560px;line-height:1.8;margin:0;color:#9dbfaf;font-size:15px}
progress{width:min(320px,80vw);height:8px;accent-color:#97c7b1}button{padding:16px 36px;background:#294e43;color:#e2efe7;border:1px solid #729786;border-radius:12px;font:inherit;cursor:pointer}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#102e2af5;z-index:4;font-size:22px}
@media(orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

</head>
<body>
<canvas id="canvas" width="1280" height="720" tabindex="0">请使用支持 WebGL 2 的 Safari。</canvas>
<section id="loading"><h1>发条远行</h1><p id="message">第 1–9 关 · 横屏游玩<br>左手摇杆移动 · 右手左攻击、右跳跃</p><progress id="progress" value="0" max="1" hidden></progress><button id="start">进入游戏</button><p id="connection"></p></section>
<div id="rotate">请将 iPad 横过来游玩</div>

<script>
const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":32085016,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
'use strict';
config.serviceWorker='';
const start=document.getElementById('start'),progress=document.getElementById('progress');
const message=document.getElementById('message'),connection=document.getElementById('connection');
const buildVersion='95343c998b9a22e8';
let installed=false,busy=false,starting=false,needsReload=false,setupPromise=null,watchdog=null,lastProgress=0;
let phase='checking',engine=null;
const statusWaiters=new Set();
window.loadingPhase=phase;
function setPhase(value){phase=value;window.loadingPhase=value;}
function deadline(promise,ms,text){let timer;return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error(text)),ms);})]).finally(()=>clearTimeout(timer));}
function stopWatch(){clearInterval(watchdog);watchdog=null;}
function failure(error,reload=false){
  stopWatch();busy=false;starting=false;needsReload=reload;setPhase('error');
  start.hidden=false;start.disabled=false;start.textContent=reload?'重新打开游戏':'继续下载 / 重试';
  message.textContent=String(error.message||error);progress.hidden=true;
}
function showReady(){
  if(starting||window.gameReady)return;
  installed=true;window.offlineReady=true;busy=false;stopWatch();setPhase('ready');
  start.disabled=false;start.hidden=false;start.textContent='开始游戏';progress.hidden=true;
  message.textContent='离线就绪 · 第 1–9 关已保存在本机';
  connection.textContent='Safari 分享 → 添加到主屏幕。显示离线就绪后，可断网游玩。';
}
function acceptVersion(m){
  if(window.gameReady||starting)return false;
  if(m.version&&m.version!==buildVersion){
    const key='clockwork-reload-'+m.version;
    if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');location.reload();}
    else failure('页面和离线文件版本不同，请重新打开以完成更新。',true);
    return false;
  }
  return true;
}
async function setup(){
  if(!window.isSecureContext||!('serviceWorker' in navigator))throw Error('请用 Safari 打开游戏的 HTTPS 地址。');
  // An installed offline game must not wait for a network update before opening.
  if(navigator.serviceWorker.controller){
    navigator.serviceWorker.getRegistration('./').then(r=>{if(navigator.onLine)r?.update().catch(()=>{});}).catch(()=>{});
    return;
  }
  message.textContent='正在检查离线组件…';
  await deadline(navigator.serviceWorker.register('./offline-worker.js',{scope:'./',updateViaCache:'none'}),25000,'连接暂时没有响应，请点击重试。');
  await deadline(new Promise(resolve=>{
    if(navigator.serviceWorker.controller)return resolve();
    const changed=()=>{if(navigator.serviceWorker.controller){navigator.serviceWorker.removeEventListener('controllerchange',changed);resolve();}};
    navigator.serviceWorker.addEventListener('controllerchange',changed);
  }),30000,'离线组件下载未完成，请点击重试。');
}
function ensureSetup(){
  if(!setupPromise)setupPromise=setup().catch(e=>{setupPromise=null;throw e;});
  return setupPromise;
}
function queryStatus(){
  return deadline(new Promise((resolve,reject)=>{
    const waiter={resolve,reject};statusWaiters.add(waiter);
    if(!navigator.serviceWorker.controller){statusWaiters.delete(waiter);reject(Error('离线组件未连接，请重新打开。'));return;}
    navigator.serviceWorker.controller.postMessage({type:'STATUS'});
    setTimeout(()=>statusWaiters.delete(waiter),10000);
  }),10000,'离线检查没有响应，请重新打开后重试。');
}
navigator.serviceWorker?.addEventListener('message',event=>{
  const m=event.data;if(!m||!acceptVersion(m))return;
  if(m.type==='STATUS'){
    installed=!!m.ready;window.offlineReady=installed;
    for(const waiter of statusWaiters)waiter.resolve(m);statusWaiters.clear();
    if(installed)showReady();
    else if(phase==='checking'){
      busy=false;start.disabled=false;start.textContent='下载并准备离线游戏';
      message.textContent='需要下载约 72 MB，下载进度会实时显示；中断后可以继续。';setPhase('download-needed');
    }
  }
  if(m.type==='PROGRESS'){
    lastProgress=Date.now();progress.hidden=false;progress.max=m.total;progress.value=m.loaded;
    const mb=n=>(n/1048576).toFixed(1);
    message.textContent=(m.note?m.note+' · ':'正在下载 ')+mb(m.loaded)+' / '+mb(m.total)+' MB（'+Math.floor(m.loaded/m.total*100)+'%）';
  }
  if(m.type==='READY')showReady();
  if(m.type==='ERROR'){
    for(const waiter of statusWaiters)waiter.reject(Error(m.message));statusWaiters.clear();failure(m.message);
  }
});
navigator.serviceWorker?.addEventListener('controllerchange',()=>{
  if(!window.gameReady&&!starting)queryStatus().catch(e=>failure(e));
});
async function loadEngine(){
  if(window.Engine)return;
  await deadline(new Promise((resolve,reject)=>{
    const script=document.createElement('script');script.src='index.js';script.async=true;
    script.onload=()=>resolve();script.onerror=()=>{script.remove();reject(Error('游戏程序未加载，请重试。'));};
    document.head.appendChild(script);
  }),20000,'游戏程序加载超时，请重新打开。');
}
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
connection.textContent='首次联网下载；已保存的部分会保留，重试无需从头开始。';
start.disabled=true;start.textContent='正在检查…';
ensureSetup().then(queryStatus).catch(e=>failure(e));
start.addEventListener('click',async()=>{
  if(needsReload){location.reload();return;}
  if(busy)return;
  busy=true;start.disabled=true;
  try{
    await ensureSetup();await queryStatus();
    if(!installed){
      busy=true;start.disabled=true;setPhase('downloading');lastProgress=Date.now();
      message.textContent='正在连接下载，已完成的部分将自动续传…';progress.hidden=false;
      stopWatch();watchdog=setInterval(()=>{if(Date.now()-lastProgress>55000)failure('下载暂时没有响应。已下载部分已保留，点击继续下载。');},1000);
      navigator.serviceWorker.controller.postMessage({type:'INSTALL'});return;
    }
    busy=true;starting=true;setPhase('starting');start.hidden=true;progress.hidden=false;
    message.textContent='正在读取已下载的游戏…';
    await loadEngine();
    const missing=Engine.getMissingFeatures({threads:false});
    if(missing.length)throw Error('浏览器缺少 '+missing.join('、')+'，请升级 iPadOS 后重试。');
    engine=new Engine(config);const began=Date.now();let bytes='';
    stopWatch();watchdog=setInterval(()=>{message.textContent=(bytes||'正在启动游戏')+' · '+Math.floor((Date.now()-began)/1000)+' 秒';},1000);
    await deadline(engine.startGame({canvas:document.getElementById('canvas'),canvasResizePolicy:0,onProgress:(current,total)=>{
      if(total>0){progress.max=total;progress.value=current;bytes='读取游戏 '+Math.floor(current/total*100)+'%';}
    }}),120000,'游戏启动未完成，请重新打开后重试。');
    stopWatch();setPhase('playing');window.gameReady=true;document.getElementById('loading').remove();document.getElementById('canvas').focus();
  }catch(e){failure(e,starting);}
});

</script>
</body>
</html>
